[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hasp Contributors"]
repository = "https://github.com/rustpunk/hasp"

[workspace.dependencies]
url = "2.5"
thiserror = "1.0"
secrecy = "0.10"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
proptest = "1.5"
# sha2 — RustCrypto SHA-2 family; pure Rust, zero advisories, already a
# transitive dep. Used by `hasp profile allow` for profiles.toml integrity.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
