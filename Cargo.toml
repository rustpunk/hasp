[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hasp Contributors"]
repository = "https://github.com/rustpunk/hasp"

[workspace.dependencies]
# Internal crates. Carry both `path` (for local workspace builds) and `version`
# (required by `cargo publish`, which strips the path and resolves from the
# registry). Keep every version in lockstep with workspace.package.version.
hasp = { path = "crates/hasp", version = "0.2.0-alpha" }
hasp-core = { path = "crates/hasp-core", version = "0.2.0-alpha" }
hasp-backend-env = { path = "crates/hasp-backend-env", version = "0.2.0-alpha" }
hasp-backend-file = { path = "crates/hasp-backend-file", version = "0.2.0-alpha" }
hasp-backend-keyring = { path = "crates/hasp-backend-keyring", version = "0.2.0-alpha" }
hasp-backend-op = { path = "crates/hasp-backend-op", version = "0.2.0-alpha" }
hasp-backend-vault = { path = "crates/hasp-backend-vault", version = "0.2.0-alpha" }
hasp-backend-bw = { path = "crates/hasp-backend-bw", version = "0.2.0-alpha" }
hasp-backend-aws-sm = { path = "crates/hasp-backend-aws-sm", version = "0.2.0-alpha" }
hasp-backend-aws-ssm = { path = "crates/hasp-backend-aws-ssm", version = "0.2.0-alpha" }
hasp-backend-gcp-sm = { path = "crates/hasp-backend-gcp-sm", version = "0.2.0-alpha" }
hasp-backend-azure-kv = { path = "crates/hasp-backend-azure-kv", version = "0.2.0-alpha" }
url = "2.5"
thiserror = "1.0"
secrecy = "0.10"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
proptest = "1.5"
# sha2 — RustCrypto SHA-2 family; pure Rust, zero advisories, already a
# transitive dep. Used by `hasp profile allow` for profiles.toml integrity.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
