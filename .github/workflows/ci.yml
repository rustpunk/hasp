name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-set:
          - name: all-features
            flags: --all-features
          - name: default-only
            flags:
          - name: minimal-backends
            flags: --no-default-features --features env,file,keyring
    name: lint-and-test (${{ matrix.feature-set.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.feature-set.name == 'all-features'
        run: cargo fmt --check

      - name: Build
        run: cargo build ${{ matrix.feature-set.flags }}

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.feature-set.flags }} -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.feature-set.flags }}

      - name: Build docs
        if: matrix.feature-set.name == 'all-features'
        run: cargo doc --no-deps

      - name: Install cargo-deny
        if: matrix.feature-set.name == 'all-features'
        run: |
          curl -sL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.1/cargo-deny-0.19.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          mkdir -p ~/.cargo/bin
          mv cargo-deny-*/cargo-deny ~/.cargo/bin/

      - name: Deny check
        if: matrix.feature-set.name == 'all-features'
        run: cargo deny check
