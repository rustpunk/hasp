name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # OIDC token + attestations API for SLSA build provenance via
  # actions/attest-build-provenance.
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: hasp-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: hasp-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: hasp-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: hasp-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        # Windows builds enable Control Flow Guard for the release
        # binary. CFG adds compiler-inserted indirect-call checks
        # and is one of the cheap exploit-mitigation wins
        # documented in the rustc Exploit Mitigations chapter.
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C control-flow-guard=yes' || '' }}
        run: cargo build --release --bin hasp --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          tar czf "dist/${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" hasp
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/hasp.exe" -DestinationPath "dist/${{ matrix.asset }}.zip"

      - name: Resolve packaged artifact path
        id: pkg
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "path=dist/${{ matrix.asset }}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "path=dist/${{ matrix.asset }}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SLSA build provenance
        id: attest
        # SHA-pinned per supply-chain best practice — the same threat
        # class this attestation defends against (the Bitwarden CLI
        # npm compromise) lets a compromised action exfiltrate the
        # OIDC token. Bumping requires editing this line; do not
        # convert back to a floating tag without explicit review.
        # v4.1.0 = a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: ${{ steps.pkg.outputs.path }}

      - name: Stage attestation alongside artifact
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pkg.outputs.path }}.intoto.jsonl"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.path }}.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
