[package]
name = "hasp-backend-gcp-sm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "gcp-sm:// backend for hasp — Google Cloud Secret Manager REST client."
keywords = ["secrets", "gcp", "google-cloud", "credentials", "hasp"]
categories = ["authentication", "api-bindings"]
documentation = "https://docs.rs/hasp-backend-gcp-sm"
readme = "README.md"

[dependencies]
hasp-core = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
gcp-auth = { package = "gcp_auth", version = "0.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
url = "2.5"
base64 = "0.22"
