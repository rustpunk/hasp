[package]
name = "hasp-backend-keyring"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "keyring:// backend for hasp — OS keyring integration."

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[dependencies]
hasp-core = { path = "../hasp-core" }
keyring-core = "1.0"
url = "2.5"
secrecy = "0.10"
