[package]
name = "hasp-backend-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "vault:// backend for hasp — HashiCorp Vault KV HTTP client."

[dependencies]
hasp-core = { path = "../hasp-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde_json = "1"
url = "2.5"

[dev-dependencies]
hasp-core = { path = "../hasp-core", features = ["test-utils"] }
