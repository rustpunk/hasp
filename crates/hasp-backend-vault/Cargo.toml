[package]
name = "hasp-backend-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "vault:// backend for hasp — HashiCorp Vault KV HTTP client."
keywords = ["secrets", "vault", "hashicorp", "credentials", "hasp"]
categories = ["authentication", "api-bindings"]
documentation = "https://docs.rs/hasp-backend-vault"
readme = "README.md"

[dependencies]
hasp-core = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde_json = "1"
url = "2.5"

[dev-dependencies]
hasp-core = { workspace = true, features = ["test-utils"] }
