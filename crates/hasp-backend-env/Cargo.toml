[package]
name = "hasp-backend-env"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "env:// backend for hasp — reads secrets from environment variables."
keywords = ["secrets", "env", "dotenv", "credentials", "hasp"]
categories = ["authentication", "config"]
documentation = "https://docs.rs/hasp-backend-env"
readme = "README.md"

[dependencies]
hasp-core = { workspace = true }
url = "2.5"
secrecy = "0.10"

[dev-dependencies]
hasp-core = { path = "../hasp-core", features = ["test-utils"] }
