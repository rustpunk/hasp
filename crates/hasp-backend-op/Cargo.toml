[package]
name = "hasp-backend-op"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "op:// backend for hasp — 1Password CLI subprocess wrapper."
keywords = ["secrets", "onepassword", "credentials", "cli", "hasp"]
categories = ["authentication", "api-bindings"]
documentation = "https://docs.rs/hasp-backend-op"
readme = "README.md"

[dependencies]
hasp-core = { workspace = true }
url = "2.5"
secrecy = "0.10"
serde_json = { workspace = true }

[dev-dependencies]
hasp-core = { workspace = true, features = ["test-utils"] }
