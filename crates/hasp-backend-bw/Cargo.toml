[package]
name = "hasp-backend-bw"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "bw:// backend for hasp — Bitwarden CLI subprocess wrapper."

[dependencies]
hasp-core = { path = "../hasp-core" }
serde_json = "1"
url = "2.5"
# Vetted 2026-05-15: marshallpierce/rust-base64, MIT/Apache, latest 0.22.1.
# Already used by hasp-backend-gcp-sm. Needed because `bw edit item` /
# `bw create item` accept payloads only as base64-encoded JSON.
base64 = "0.22"

[dev-dependencies]
url = "2.5"
hasp-core = { path = "../hasp-core", features = ["test-utils"] }
