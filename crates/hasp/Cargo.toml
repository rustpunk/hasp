[package]
name = "hasp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified secrets library with URL-addressed backends. Part of the rustpunk portfolio."
keywords = ["secrets", "credentials", "vault", "keyring", "secret-manager"]
categories = ["authentication", "cryptography", "api-bindings"]
documentation = "https://docs.rs/hasp"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["env"]
env = ["dep:hasp-backend-env"]
file = ["dep:hasp-backend-file"]
keyring = ["dep:hasp-backend-keyring"]
op = ["dep:hasp-backend-op"]
vault = ["dep:hasp-backend-vault"]
bw = ["dep:hasp-backend-bw"]
aws-sm = ["dep:hasp-backend-aws-sm"]
aws-ssm = ["dep:hasp-backend-aws-ssm"]
gcp-sm = ["dep:hasp-backend-gcp-sm"]
azure-kv = ["dep:hasp-backend-azure-kv"]
# Forward the encrypted-file persistent-cache wiring to hasp-core.
# Off by default — see hasp-core/Cargo.toml for the threat-model note.
cache-persistent = ["hasp-core/cache-persistent"]

[dependencies]
hasp-core = { workspace = true }
hasp-backend-aws-sm = { workspace = true, optional = true }
hasp-backend-aws-ssm = { workspace = true, optional = true }
hasp-backend-env = { workspace = true, optional = true }
hasp-backend-file = { workspace = true, optional = true }
hasp-backend-keyring = { workspace = true, optional = true }
hasp-backend-op = { workspace = true, optional = true }
hasp-backend-vault = { workspace = true, optional = true }
hasp-backend-bw = { workspace = true, optional = true }
hasp-backend-gcp-sm = { workspace = true, optional = true }
hasp-backend-azure-kv = { workspace = true, optional = true }
url = "2.5"

[dev-dependencies]
keyring-core = "1.0"
tempfile = "3"
hasp-core = { workspace = true, features = ["test-utils"] }
proptest = { workspace = true }
