[package]
name = "hasp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "hasp CLI — unified secrets command-line tool. Thin shell over the hasp library."
keywords = ["secrets", "credentials", "cli", "vault", "keyring"]
categories = ["command-line-utilities", "authentication"]
readme = "README.md"

[[bin]]
name = "hasp"
path = "src/main.rs"

[features]
default = ["env", "file", "keyring", "op", "vault", "bw", "aws-sm", "aws-ssm", "gcp-sm", "azure-kv"]
env = ["hasp/env"]
file = ["hasp/file"]
keyring = ["hasp/keyring"]
op = ["hasp/op"]
vault = ["hasp/vault"]
bw = ["hasp/bw"]
aws-sm = ["hasp/aws-sm"]
aws-ssm = ["hasp/aws-ssm"]
gcp-sm = ["hasp/gcp-sm"]
azure-kv = ["hasp/azure-kv"]
# Off by default — keep the binary lean. Enable for hardened deployments
# that want HASP_CACHE_TTL to persist across CLI invocations under the
# AWS-Agent envelope; see crates/hasp-core/Cargo.toml for the threat
# model boundary.
cache-persistent = ["hasp/cache-persistent"]

[dependencies]
hasp = { workspace = true }
hasp-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
rpassword = "7"
secrecy = "0.10"
clap_complete = { version = "4", features = ["unstable-dynamic"] }
clap_mangen = "0.2"
serde_json = "1"
url = "2.5"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
url = "2.5"
hasp-core = { workspace = true, features = ["test-utils"] }
