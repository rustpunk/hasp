[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
# paste via azure_core is unmaintained; we cannot easily upgrade azure-identity yet.
ignore = [{ id = "RUSTSEC-2024-0436" }]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = []
